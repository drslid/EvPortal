name: Notify search engines after Pages

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-pages
  cancel-in-progress: true

jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.build.commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Notify only the matching deployed public pages
        run: node scripts/notify-indexnow.mjs --submit --wait=300
